  lane_acks:
    anthropic:
      date: '2026-10-01'
      text_sha256: 2f1e68694c1609d51595f2f492dee95ef124c22e3dcdbf09772c28a84ecffe07
      text: 'Subscription lanes run Claude Code CLI children through your Claude subscription
        login via OpenClaw. Sharing one login between the orchestrator and lane children
        is a grey zone of the Anthropic terms, and non-interactive (-p / SDK) use
        may be billed differently from interactive use. A lane on this account is
        admitted only for the roles listed below. The spawn itself is not gated per
        role by the kit: an agent admitted for one listed role can be spawned by an
        orchestrator for any task, and only `lanes prepare --lane` refuses a role
        the acknowledgement does not list, so a step that skipped `prepare` has already
        sent its repository content to Anthropic.'
      roles:
      - code-reviewer
      - doc-writer
      - explore
      - implementer
      - planner
      - security-auditor
      - software-architect
      - tester
      - verifier
    google:
      date: '2026-10-01'
      text_sha256: 46cd7319fe9c39500b7c9d059bd0bde0ed5af7e6773cc65778a584b3a6541e5e
      text: 'The Antigravity lane runs `agy -p` children through OpenClaw on the Google
        account named below. Google''s terms name third-party tools, OpenClaw included,
        and a suspension covers Antigravity, Gemini CLI and Code Assist and may reach
        the account''s other Google services; use an account that is not used for
        wildbit GCP or other critical work if your subscription allows it. Repository
        content, diffs, test output and MCP results of every listed role go to Google
        and cannot be recalled. An agy child runs with --dangerously-skip-permissions,
        a full shell. Without a usable sandbox the tool exclusions bound the tool
        surface, not what the child can do: the shell still reaches `openclaw message`,
        `openclaw cron`, `crontab`, `systemd-run --user`, `curl` and engram''s on-disk
        store; the kit detects only the cron store, `crontab -l`, the user timer list
        and unit files. If the kit''s agy home override is the HOME variable, the
        child also loses its git identity, `PATH` shims and `~/.ssh`; without an override
        the shared `~/.gemini` state feeds your later interactive agy sessions. Placement
        uses static weights (claude 1.0, agy 0.7): it balances by role count in sorted
        role order, not by quota. The spawn itself is not gated per role by the kit:
        an agent admitted for one listed role can be spawned for any task, and only
        `lanes prepare --lane` refuses a role not listed, so a step that skipped `prepare`
        has already sent its repository content to Google. Do not use agy interactively
        during a lane run. A lane on this account is admitted only for the roles listed
        below.'
      roles:
      - code-reviewer
      account: operator@example.test
