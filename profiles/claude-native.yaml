name: claude-native
mode: single-model
description: |
  Claude Code without a gateway: each kit subagent uses a Claude alias, which always
  resolves to the newest model of that family. Haiku for read-only exploration and
  mechanical upgrades, Sonnet for implementation, tests, verification and docs,
  Opus for planning, architecture, code review and security.

by_role:
  explore:            { model: haiku }
  generalPurpose:     { model: sonnet }
  planner:            { model: opus }
  software-architect: { model: opus }
  implementer:        { model: sonnet }
  tester:             { model: sonnet }
  code-reviewer:      { model: opus }
  security-auditor:   { model: opus }
  verifier:           { model: sonnet }
  doc-writer:         { model: sonnet }
  package-upgrade:             { model: haiku }
  crashlytics-fixer:           { model: sonnet }
  sentry-fixer:                { model: sonnet }
  terraform-maintainer:        { model: sonnet }
  crossplane-upjet-maintainer: { model: sonnet }
