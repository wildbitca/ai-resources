name: all-gemini
description: |
  Every role on Google Gemini 3.x — Pro for reasoning, Flash for code/review,
  Flash-Lite for verifier. Lowest cost; some loss of code-quality precision
  on tool use compared to Claude.

  Note that gemini-3.1-pro-preview is the only Pro tier Google publishes right
  now, and it is a preview: expect it to be renamed or retired on Google's
  schedule rather than ours.

defaults:
  fallbacks: [google/gemini-3.7-flash]
  max_retries: 1
  timeout_seconds: 600

by_role:
  explore:            { provider: google, model: google/gemini-3.7-flash }
  generalPurpose:     { provider: google, model: google/gemini-3.1-pro-preview }
  doc-writer:         { provider: google, model: google/gemini-3.7-flash }
  planner:            { provider: google, model: google/gemini-3.1-pro-preview }
  software-architect: { provider: google, model: google/gemini-3.1-pro-preview }
  implementer:        { provider: google, model: google/gemini-3.1-pro-preview }
  code-reviewer:      { provider: google, model: google/gemini-3.7-flash }
  security-auditor:   { provider: google, model: google/gemini-3.1-pro-preview }
  tester:             { provider: google, model: google/gemini-3.7-flash }
  verifier:           { provider: google, model: google/gemini-3.5-flash-lite }
  package-upgrade:             { provider: google, model: google/gemini-3.1-pro-preview }
  crashlytics-fixer:           { provider: google, model: google/gemini-3.1-pro-preview }
  sentry-fixer:                { provider: google, model: google/gemini-3.1-pro-preview }
  terraform-maintainer:        { provider: google, model: google/gemini-3.1-pro-preview }
  crossplane-upjet-maintainer: { provider: google, model: google/gemini-3.1-pro-preview }
