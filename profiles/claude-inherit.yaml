name: claude-inherit
mode: single-model
description: |
  Claude Code without a gateway: every kit subagent inherits the session model
  (the model you picked with /model). Simplest and most predictable; no per-role savings.

by_role:
  explore:            { model: inherit }
  generalPurpose:     { model: inherit }
  planner:            { model: inherit }
  software-architect: { model: inherit }
  implementer:        { model: inherit }
  tester:             { model: inherit }
  code-reviewer:      { model: inherit }
  security-auditor:   { model: inherit }
  verifier:           { model: inherit }
  doc-writer:         { model: inherit }
  package-upgrade:             { model: inherit }
  crashlytics-fixer:           { model: inherit }
  sentry-fixer:                { model: inherit }
  terraform-maintainer:        { model: inherit }
  crossplane-upjet-maintainer: { model: inherit }
