name: gateway/performance
mode: multi-model
description: |
  Performance preset. Claude only, the strongest tier where defects are caught or
  decisions are made: Opus for the planner, the architect, the code reviewer, the
  security auditor and the verifier; Sonnet for every writer, tester, doc writer,
  fixer and the explorer. Fallbacks only step down one tier (Opus to Sonnet), never
  to Haiku.

  Valid in every compatibility cell it can reach without --allow-unverified (see
  tests/test_profile_validity.py). Gateway-agnostic: no `backend` key and every model
  is named anthropic/<model>, so a LiteLLM or an OpenRouter gateway serves it.

  Evidence: INFERRED from the 2026-10 study (study-planning, study-review-security);
  the 5.5 family is not measured in this repository. Costs more than balanced-claude-55
  because the planner, the reviewer and the verifier move up a tier.

classes:
  opus:   anthropic/claude-opus-5.5
  sonnet: anthropic/claude-sonnet-5.5
  haiku:  anthropic/claude-haiku-5.5
  fable:  anthropic/claude-fable-5.1

defaults:
  fallbacks: []
  max_retries: 2
  timeout_seconds: 600

by_role:
  explore:                      { model: anthropic/claude-sonnet-5.5 }
  tester:                       { model: anthropic/claude-sonnet-5.5 }
  doc-writer:                   { model: anthropic/claude-sonnet-5.5 }
  package-upgrade:              { model: anthropic/claude-sonnet-5.5 }
  generalPurpose:               { model: anthropic/claude-sonnet-5.5 }
  implementer:                  { model: anthropic/claude-sonnet-5.5 }
  crashlytics-fixer:            { model: anthropic/claude-sonnet-5.5 }
  sentry-fixer:                 { model: anthropic/claude-sonnet-5.5 }
  terraform-maintainer:         { model: anthropic/claude-sonnet-5.5 }
  crossplane-upjet-maintainer:  { model: anthropic/claude-sonnet-5.5 }
  code-reviewer:                { model: anthropic/claude-opus-5.5 }
  security-auditor:             { model: anthropic/claude-opus-5.5 }
  verifier:                     { model: anthropic/claude-opus-5.5 }
  planner:                      { model: anthropic/claude-opus-5.5 }
  software-architect:           { model: anthropic/claude-opus-5.5 }

by_persona: {}
