name: quality-first
description: |
  Quality-first routing: Claude for all code-critical roles (planner, architect,
  implementer, reviewer, security, specialists), Gemini for high-volume support
  roles (explore, doc-writer, tester). Roughly 35-50% cheaper than all-Claude on
  typical feature-implementation runs without sacrificing code quality.

defaults:
  fallbacks: [claude-haiku-4-5]
  max_retries: 1
  timeout_seconds: 600

by_role:
  # Large context / web search / exploration → Gemini
  explore:            { provider: google,    model: gemini-3.7-flash, fallbacks: [claude-sonnet-5] }
  generalPurpose:     { provider: google,    model: gemini-3.1-pro-preview,   fallbacks: [claude-sonnet-5] }
  doc-writer:         { provider: google,    model: gemini-3.7-flash, fallbacks: [claude-sonnet-5] }

  # Reasoning + instruction-following → Claude
  planner:            { provider: anthropic, model: claude-sonnet-5 }
  software-architect: { provider: anthropic, model: claude-opus-5,  fallbacks: [claude-sonnet-5] }
  implementer:        { provider: anthropic, model: claude-sonnet-5 }
  code-reviewer:      { provider: anthropic, model: claude-sonnet-5 }
  security-auditor:   { provider: anthropic, model: claude-sonnet-5 }

  # Mechanical / cheap → Gemini Flash for tester, Haiku for verifier
  tester:             { provider: google,    model: gemini-3.7-flash, fallbacks: [claude-haiku-4-5] }
  verifier:           { provider: anthropic, model: claude-haiku-4-5 }

  # Domain specialists — code-heavy work → Claude
  package-upgrade:             { provider: anthropic, model: claude-sonnet-5 }
  crashlytics-fixer:           { provider: anthropic, model: claude-sonnet-5 }
  sentry-fixer:                { provider: anthropic, model: claude-sonnet-5 }
  terraform-maintainer:        { provider: anthropic, model: claude-sonnet-5 }
  crossplane-upjet-maintainer: { provider: anthropic, model: claude-sonnet-5 }
