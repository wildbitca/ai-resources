name: openrouter-balanced
mode: multi-model
description: |
  Default OpenRouter profile. Judgement stays on Claude; high-volume reading and
  mechanical checks move to Gemini Flash. Roughly half the cost of all-Claude on a
  feature run, with review, architecture and security untouched.

  Model IDs are namespaced and were round-tripped against OpenRouter on 2026-09-16.
  Prices below are $/1M input-output at that date.

# Alias -> concrete model for the MAIN conversation (/model, and any subagent that
# says `inherit`). Subagents with an explicit model: override these.
classes:
  opus:   anthropic/claude-opus-5
  sonnet: anthropic/claude-sonnet-5
  haiku:  anthropic/claude-haiku-4.5
  fable:  anthropic/claude-fable-5.1

defaults:
  fallbacks: [anthropic/claude-haiku-4.5]
  max_retries: 2
  timeout_seconds: 600

# Per-persona overrides, keyed by persona name. A persona with no entry here
# inherits its base role's model below, which is why this starts empty: adding
# the mechanism should not silently re-route anyone. Uncomment to split a role
# by domain, for example when one stack's reviews need more judgement than
# another's:
#
# by_persona:
#   code-reviewer-devops:  { model: anthropic/claude-opus-5 }
#   code-reviewer-angular: { model: anthropic/claude-sonnet-5 }
by_persona: {}

by_role:
  # Reading-heavy, cheap — context in, summary out
  explore:            { model: google/gemini-3.7-flash }      # 0.75 / 3.75
  doc-writer:         { model: google/gemini-3.7-flash }
  tester:             { model: google/gemini-3.7-flash }
  generalPurpose:     { model: anthropic/claude-sonnet-5 }    # 2 / 10

  # Judgement — worth the tokens
  planner:            { model: anthropic/claude-opus-5 }      # 5 / 25
  software-architect: { model: anthropic/claude-opus-5 }
  code-reviewer:      { model: anthropic/claude-opus-5 }
  security-auditor:   { model: anthropic/claude-opus-5 }

  # Writing code — Sonnet is the sweet spot
  implementer:        { model: anthropic/claude-sonnet-5 }

  # Mechanical verification
  verifier:           { model: anthropic/claude-haiku-4.5 }   # 1 / 5
  package-upgrade:    { model: anthropic/claude-haiku-4.5 }

  # Domain specialists — code-heavy
  crashlytics-fixer:           { model: anthropic/claude-sonnet-5 }
  sentry-fixer:                { model: anthropic/claude-sonnet-5 }
  terraform-maintainer:        { model: anthropic/claude-sonnet-5 }
  crossplane-upjet-maintainer: { model: anthropic/claude-sonnet-5 }
