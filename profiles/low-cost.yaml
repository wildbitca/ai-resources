name: low-cost
mode: single-model
description: |
  Low pricing preset for a Claude subscription without a gateway: the cheapest tier
  that still keeps defects caught. Haiku for read-only exploration, docs and mechanical
  upgrades; Sonnet for the planner, the architect, writers, tests and the code reviewer;
  Opus only for the two checkers.

  Checker independence by family is not traded for price: the verifier and the security
  auditor stay on Opus and no writer role runs on Opus, so the saving comes from the
  planner and architect moving to Sonnet and from docs and upgrades moving to Haiku, not
  from weakening verification, review or security (rule 017). The checkers declare no
  fallback. Fallbacks are inert in single-model mode.

  Versus balanced (retuned 2026-10-22, ADR-0014 D1): the two now differ only in the tester (low-cost keeps it on
  Sonnet with a Haiku fallback; balanced runs it on Haiku with a Sonnet fallback) and in explore's Sonnet fallback.
  Alias drift applies.

  Evidence label: INFERRED, medium to low confidence, curated from the 2026-10 study
  (study-support-roles, study-subscriptions) and not score-derived.

evidence:
  tag: study-based
  label: INFERRED
  confidence: medium-low
  source: 2026-10 study of the 5.5 models
role_effort:
  planner: high
  implementer: high

classes:
  opus:   opus
  sonnet: sonnet
  haiku:  haiku

defaults:
  fallbacks: []

by_role:
  explore:                      { model: haiku }
  tester:                       { model: sonnet, fallbacks: [haiku] }
  doc-writer:                   { model: haiku }
  package-upgrade:              { model: haiku }
  generalPurpose:               { model: sonnet }
  implementer:                  { model: sonnet }
  crashlytics-fixer:            { model: sonnet }
  sentry-fixer:                 { model: sonnet }
  terraform-maintainer:         { model: sonnet }
  crossplane-upjet-maintainer:  { model: sonnet }
  code-reviewer:                { model: sonnet }
  security-auditor:             { model: opus }
  verifier:                     { model: opus }
  planner:                      { model: sonnet }
  software-architect:           { model: sonnet }

by_persona: {}

# Which backend runs each role (Claude Code or Antigravity) is the routing matrix in scoring/routing.py (ADR-0019);
# an optional top-level `routing: {role: {primary, fallback}}` block overrides single cells.
