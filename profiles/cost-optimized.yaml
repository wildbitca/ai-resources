name: cost-optimized
description: |
  Maximum cost reduction with high reliability. Gemini Flash everywhere except
  code/architect (Claude Sonnet for quality). Verifier on Flash-Lite.

  Cost safeguards:
  - max_retries: 3 (not 1) — more resilient, fewer expensive fallbacks
  - Tier-based fallbacks ONLY:
    - Flash (cheap) → Flash-lite (cheaper)
    - Pro (mid) → Flash (downgrade to cheaper)
    - Sonnet (expensive) → Haiku (downgrade to cheaper)
    - NEVER upgrade to expensive models

  Suitable for low-stakes or experimental projects with cost-conscious retry strategy.

defaults:
  max_retries: 3
  timeout_seconds: 600
  # NO global fallbacks — each tier has its own strategy

by_role:
  # TIER 1 — Flash (cheapest, exploration)
  explore:
    model: google/gemini-3.7-flash
    fallbacks: [google/gemini-3.5-flash-lite]  # downgrade only
  generalPurpose:
    model: google/gemini-3.7-flash
    fallbacks: [google/gemini-3.5-flash-lite]  # downgrade only
  doc-writer:
    model: google/gemini-3.7-flash
    fallbacks: [google/gemini-3.5-flash-lite]  # downgrade only
  tester:
    model: google/gemini-3.7-flash
    fallbacks: [google/gemini-3.5-flash-lite]  # downgrade only

  # TIER 2 — Flash-lite (cheapest, fast)
  verifier:
    model: google/gemini-3.5-flash-lite
    fallbacks: []  # already cheapest, no fallback

  # TIER 3 — Pro (mid-tier, planning/review)
  planner:
    model: google/gemini-3.1-pro-preview
    fallbacks: [google/gemini-3.7-flash]  # downgrade to flash if needed (cost < quality)
  code-reviewer:
    model: google/gemini-3.1-pro-preview
    fallbacks: [google/gemini-3.7-flash]  # downgrade to flash
  security-auditor:
    model: google/gemini-3.1-pro-preview
    fallbacks: [google/gemini-3.7-flash]  # downgrade to flash
  crashlytics-fixer:
    model: google/gemini-3.1-pro-preview
    fallbacks: [google/gemini-3.7-flash]  # downgrade to flash
  sentry-fixer:
    model: google/gemini-3.1-pro-preview
    fallbacks: [google/gemini-3.7-flash]  # downgrade to flash

  # TIER 4 — Claude Sonnet (expensive, architecture)
  software-architect:
    model: anthropic/claude-sonnet-5
    fallbacks: [anthropic/claude-haiku-4.5]  # downgrade to haiku, NEVER upgrade
  implementer:
    model: anthropic/claude-sonnet-5
    fallbacks: [anthropic/claude-haiku-4.5]  # downgrade to haiku
  terraform-maintainer:
    model: anthropic/claude-sonnet-5
    fallbacks: [anthropic/claude-haiku-4.5]  # downgrade to haiku
  crossplane-upjet-maintainer:
    model: anthropic/claude-sonnet-5
    fallbacks: [anthropic/claude-haiku-4.5]  # downgrade to haiku

  # TIER 5 — Haiku (cheapest claude)
  package-upgrade:
    model: anthropic/claude-haiku-4.5
    fallbacks: []  # cheapest, no fallback
