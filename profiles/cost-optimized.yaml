name: cost-optimized
description: |
  Maximum cost reduction with high reliability. Gemini 2.5 Flash everywhere except
  code/architect (Claude Sonnet for quality). Verifier on Flash-Lite.

  Cost safeguards:
  - max_retries: 3 (not 1) — more resilient, fewer expensive fallbacks
  - Tier-based fallbacks ONLY:
    - Flash (cheap) → Flash-lite (cheaper)
    - Pro (mid) → Flash (downgrade to cheaper)
    - Sonnet (expensive) → Haiku (downgrade to cheaper)
    - NEVER upgrade to expensive models

  Suitable for low-stakes or experimental projects with cost-conscious retry strategy.

defaults:
  max_retries: 3
  timeout_seconds: 600
  # NO global fallbacks — each tier has its own strategy

by_role:
  # TIER 1 — Flash (cheapest, exploration)
  explore:
    provider: google
    model: gemini-2.5-flash
    fallbacks: [gemini-2.5-flash-lite]  # downgrade only
  generalPurpose:
    provider: google
    model: gemini-2.5-flash
    fallbacks: [gemini-2.5-flash-lite]  # downgrade only
  doc-writer:
    provider: google
    model: gemini-2.5-flash
    fallbacks: [gemini-2.5-flash-lite]  # downgrade only
  tester:
    provider: google
    model: gemini-2.5-flash
    fallbacks: [gemini-2.5-flash-lite]  # downgrade only

  # TIER 2 — Flash-lite (cheapest, fast)
  verifier:
    provider: google
    model: gemini-2.5-flash-lite
    fallbacks: []  # already cheapest, no fallback

  # TIER 3 — Pro (mid-tier, planning/review)
  planner:
    provider: google
    model: gemini-2.5-pro
    fallbacks: [gemini-2.5-flash]  # downgrade to flash if needed (cost < quality)
  code-reviewer:
    provider: google
    model: gemini-2.5-pro
    fallbacks: [gemini-2.5-flash]  # downgrade to flash
  security-auditor:
    provider: google
    model: gemini-2.5-pro
    fallbacks: [gemini-2.5-flash]  # downgrade to flash
  crashlytics-fixer:
    provider: google
    model: gemini-2.5-pro
    fallbacks: [gemini-2.5-flash]  # downgrade to flash
  sentry-fixer:
    provider: google
    model: gemini-2.5-pro
    fallbacks: [gemini-2.5-flash]  # downgrade to flash

  # TIER 4 — Claude Sonnet (expensive, architecture)
  software-architect:
    provider: anthropic
    model: claude-sonnet-4-6
    fallbacks: [claude-haiku-4-5-20251001]  # downgrade to haiku, NEVER upgrade
  implementer:
    provider: anthropic
    model: claude-sonnet-4-6
    fallbacks: [claude-haiku-4-5-20251001]  # downgrade to haiku
  terraform-maintainer:
    provider: anthropic
    model: claude-sonnet-4-6
    fallbacks: [claude-haiku-4-5-20251001]  # downgrade to haiku
  crossplane-upjet-maintainer:
    provider: anthropic
    model: claude-sonnet-4-6
    fallbacks: [claude-haiku-4-5-20251001]  # downgrade to haiku

  # TIER 5 — Haiku (cheapest claude)
  package-upgrade:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    fallbacks: []  # cheapest, no fallback
