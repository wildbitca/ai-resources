name: all-claude
description: |
  Every role on Anthropic Claude — Opus for hardest reasoning, Sonnet for
  code/review, Haiku for cheap deterministic checks. No Gemini key required.
  Highest reliability, highest cost.

defaults:
  fallbacks: [anthropic/claude-haiku-4.5]
  max_retries: 1
  timeout_seconds: 600

by_role:
  explore:            { model: anthropic/claude-sonnet-5 }
  generalPurpose:     { model: anthropic/claude-sonnet-5 }
  doc-writer:         { model: anthropic/claude-sonnet-5 }
  planner:            { model: anthropic/claude-sonnet-5 }
  software-architect: { model: anthropic/claude-opus-5, fallbacks: [anthropic/claude-sonnet-5] }
  implementer:        { model: anthropic/claude-sonnet-5 }
  code-reviewer:      { model: anthropic/claude-sonnet-5 }
  security-auditor:   { model: anthropic/claude-sonnet-5 }
  tester:             { model: anthropic/claude-haiku-4.5 }
  verifier:           { model: anthropic/claude-haiku-4.5 }
  package-upgrade:             { model: anthropic/claude-sonnet-5 }
  crashlytics-fixer:           { model: anthropic/claude-sonnet-5 }
  sentry-fixer:                { model: anthropic/claude-sonnet-5 }
  terraform-maintainer:        { model: anthropic/claude-sonnet-5 }
  crossplane-upjet-maintainer: { model: anthropic/claude-sonnet-5 }
