name: balanced
mode: single-model
description: |
  Performant and low-cost mix for a Claude subscription without a gateway (retuned 2026-10-22, ADR-0014 D1): Haiku 5.5 for
  the reading-heavy and mechanical roles (explore, tester, doc-writer, package-upgrade), Sonnet 5.5 for the planner, the
  architect, the writers and the code reviewer, Opus 5.5 for the two checkers only (verifier, security-auditor).

  The Haiku roles must stay under the 100k-token Haiku price tier: `validate_kit.py` estimates each Haiku role's static
  prompt (tests/test_haiku_prompt_budget.py) and the audit reports the share of Haiku calls above 100k at run time.

  Checker independence by family: the verifier and the security auditor run on Opus and no writer role (implementer,
  tester, doc-writer, the fixers, package-upgrade, generalPurpose) runs on Opus, so a checker never shares a model family
  with the code it checks. Fallbacks are inert in single-model mode. The checkers declare none, so a fallback cannot move
  them onto a writer's family; no role falls back to Opus (the planner and the architect declare none), and the Haiku
  roles that declare one fall back only to Sonnet (explore, tester).

  Versus the earlier balanced table: the tester, the doc-writer and package-upgrade move to Haiku, and the architect moves
  from Opus to Sonnet. A host that saved this profile sees the old -> new table at its next `setup` (ADR-0001).

  Alias drift: an alias floats to the newest model of its family, so a family upgrade can change which Sonnet or Opus runs
  without any kit change. Independence still holds (families stay distinct), but the evidence behind this table (the
  2026-10 study of the 5.5 models) may stop describing what runs.

  Security-auditor caveat (Vals CyberBench): Opus 5.5 scores 74.6 when tagged CVP and 55.4 untagged; Sonnet 5.5 scores
  59.6. The operator account holds no CVP tag, so the untagged 55.4 is the conservative reference, and on that value Sonnet
  5.5 is ahead. The auditor stays on Opus to keep it off the writers' family.

  Evidence label: INFERRED, medium to low confidence, curated from the 2026-10 study and not score-derived. The planner is
  a statistical tie (Vals 67.04 vs 66.97); Sonnet was chosen. Compose disagrees with this table; this profile is a
  reference, and `balanced-claude-55` remains the recommended profile.

# Per-role evidence tag and effort (ADR-0007 FU-3, FU-4). The map is `role_effort`, never `effort`:
# the profile keeps no `effort` key (tests/test_profile_subscription_claude55.py): read-only metadata copied into `lanes.yaml`
# `resolved:`. They never move a role to another model or lane.
evidence:
  tag: study-based
  label: INFERRED
  confidence: medium-low
  source: 2026-10 study of the 5.5 models
role_effort:
  planner: high
  implementer: high

classes:
  opus:   opus
  sonnet: sonnet
  haiku:  haiku

defaults:
  fallbacks: []

by_role:
  explore:            { model: haiku, fallbacks: [sonnet] }
  tester:             { model: haiku, fallbacks: [sonnet] }
  doc-writer:         { model: haiku }
  package-upgrade:    { model: haiku }
  generalPurpose:     { model: sonnet }
  implementer:        { model: sonnet }
  crashlytics-fixer:           { model: sonnet }
  sentry-fixer:                { model: sonnet }
  terraform-maintainer:        { model: sonnet }
  crossplane-upjet-maintainer: { model: sonnet }
  code-reviewer:      { model: sonnet }
  security-auditor:   { model: opus }
  verifier:           { model: opus }
  planner:            { model: sonnet }
  software-architect: { model: sonnet }

by_persona: {}

# Subscription lanes (ADR-0007): candidate lists per role, never an agent id. Dispatch resolves them
# from the setup lanes table; the order is the tie-break, not a rank. A fresh install enables none.
#
# Balanced is multi-provider (ADR-0010 PD-1): Claude on every role, plus Gemini over the Antigravity lane on the report
# roles that read a lot and where a different family helps: explore, and the second opinions of the code-reviewer, the
# planner and the software-architect. Every Gemini candidate is pinned (it is not the role's family) and held until
# --lanes-antigravity, a Google acknowledgement that lists the role, and the Antigravity gates G0-G7 are all proven; the
# slugs stay unconfirmed until the operator's evidence record names them. Presets carry no agy writer: no agy candidate
# sits on the implementer, tester, doc-writer, generalPurpose, package-upgrade or the fixers, so proving the gates never
# moves writer work onto Antigravity. The verifier and the security-auditor take no Gemini and no second member (checker
# rule, rule 017). The planner and architect seconds are display-only: no workflow step dispatches them yet. Each
# second keeps its role's own Claude family as the non-Gemini member, so lane drift never fires on them.
lanes:
  roles:
    explore:            ["agy:gemini-3.8-flash-high", claude-cli:haiku, claude-code]
    implementer:        [claude-cli:sonnet, claude-code]
    tester:             [claude-cli:haiku, claude-code]
    doc-writer:         [claude-cli:haiku, claude-code]
    planner:            [claude-code, claude-cli:sonnet]
    software-architect: [claude-code, claude-cli:sonnet]
    verifier:           [claude-code, claude-cli:opus, "agy:claude-opus-5-5"]
    security-auditor:   [claude-code, claude-cli:opus, "agy:claude-opus-5-5"]
  second:
    code-reviewer:      ["agy:gemini-4-argon-high", claude-cli:sonnet]
    planner:            ["agy:gemini-4-argon-high", claude-cli:sonnet]
    software-architect: ["agy:gemini-4-argon-high", claude-cli:sonnet]
  pins:
    explore:            ["agy:gemini-3.8-flash-high"]
    code-reviewer:      ["agy:gemini-4-argon-high"]
    planner:            ["agy:gemini-4-argon-high"]
    software-architect: ["agy:gemini-4-argon-high"]
