# Domain-agnostic feature workflow template.
# Orchestrator resolves {{domain}} from detection. Domain-specific content comes from:
#   - _domain-commands.yaml (commands, research_guidance, implement_guidance)
#   - Persona files (personas/{role}-{domain}.md → roles/{role}.md)
#
# Flow: [worktree] → research → plan → architect → implement → test → (review ‖ security) → verify → [merge]
# REQUIRES worktree. See .cursorrules.
#
# handoff_file: .agent-output/handoff-<branch>.md. DELETE when DONE.
# Domain commands: $AGENT_KIT/workflows/_domain-commands.yaml ({{domain}} section)
#
# Deterministic alternative: `/kit-plan` then `/kit-implement` run this loop as workflow scripts
# (one writer, test gate, parallel review lenses, verified findings). Use this YAML when running
# the steps from the session, or when a step needs judgement the script cannot encode.
#
# Rules: (1) NEVER implement without an approved plan
# (2) The implementer writes the tests for what it changes (TDD); the tester is the gate that runs
#     the full suite, and the review step audits the test diff for weakened assertions
# (3) ALWAYS code-review before considering done
# (4) ALWAYS security-auditor for features with sensitive data
#
# execution_hints: optional metadata for runtimes that support parallel execution.
#   parallel_group: steps sharing the same group name CAN run concurrently.
#   Runtimes that can't run subagents concurrently ignore hints and execute sequentially.
#   Parallel steps do NOT edit {{handoff_file}}: each ends its report with its verdict fields,
#   and the orchestrator copies them into the handoff once the whole group has returned
#   (see WORKFLOW_CONTRACT.md § Rules for parallel steps).
#
name: feature-implementation
description: Domain-agnostic feature workflow. research → plan → architect → implement → test → (review ‖ security) → verify.
domain: "{{domain}}"
trigger: User asks to implement a feature, new functionality, or multi-step task.
prerequisites: [ ]
steps:
  - id: research
    subagent_type: generalPurpose
    skills:
      - common-best-practices
      - common-context-optimization
    entry_criteria: User goal defined
    exit_criteria: Research document written to specs/knowledge/research/
    handoff_to: plan
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Goal: {{user_goal}}.
      Assess task complexity. If simple (config change, cosmetic, single-file), set Research_needed: no in {{handoff_file}} and advance.
      If complex (new feature, multi-file, unfamiliar area):
        1. Read relevant specs from specs/features/ and specs/architecture/ for existing requirements and constraints.
        2. Search specs/knowledge/research/ for prior research on this topic.
        3. Follow the research_guidance from $AGENT_KIT/workflows/_domain-commands.yaml for {{domain}}.
        4. Generate specs/knowledge/research/YYMMDD-{topic}.md with: summary, file:line refs, architecture insights, existing patterns, open questions.
      Update {{handoff_file}} (Research_ref, Spec_refs: list of specs read, Research_needed, Next=planner).
      If blocked, set Blocked: true, Return_to_step: research, Block_reason: [reason].
  - id: plan
    subagent_type: planner
    skills:
      - common-product-requirements
      - common-system-design
    entry_criteria: Research complete or skipped
    exit_criteria: Plan with acceptance criteria written
    handoff_to: architect
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Goal: {{user_goal}}.
      Read Research_ref and Spec_refs from {{handoff_file}}. Read relevant specs from specs/features/ for existing requirements.
      If the spec has status != stub, read its ## Test Scenarios (BDD) section and derive acceptance criteria from specific TS-IDs.
      If the spec is a stub, write acceptance criteria as Given/When/Then so they can be promoted to spec scenarios later.
      Iterate the plan internally at least 2 times: first draft, self-review, refined version.
      Output: Create plan YYMMDD-NNN.md in .agent-output/planner/ with description, files, steps, checklist, security notes, Requires_tests, Security_critical_feature.
      Each phase MUST include: (a) Automated_verification: exact commands + expected exit codes + TS-IDs that must pass, (b) Manual_verification: human-only checklist or "none".
      Save plan also to specs/knowledge/decisions/YYMMDD-{topic}-plan.md.
      Update {{handoff_file}} (Plan_ref, Requires_tests, Security_critical_feature, Requirements_preserved: key constraints from specs + TS-IDs, Next=software-architect).
      If blocked, set Blocked: true, Return_to_step: plan, Block_reason: [reason].
  - id: architect
    subagent_type: software-architect
    skills:
      - common-architecture-diagramming
      - common-system-design
    entry_criteria: Plan exists
    exit_criteria: Architecture designed and plan validated
    handoff_to: implement
    on_concern_return_to: plan
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}}, Plan_ref, Spec_refs, and existing ADRs in specs/architecture/.

      ## Step 1 — Design (MANDATORY, do first)
      Produce an explicit architecture design for this feature. Output in .agent-output/architect/YYMMDD-NNN.md:
      - Layer map: which layers this feature touches and what lives in each
      - Pattern selection: which patterns apply (Repository, Service, Factory, Strategy, CQRS, etc.) and why
      - SOLID application: interfaces to invert (DIP), responsibilities to split (SRP), extension points (OCP)
      - Key interfaces / contracts: names of interfaces/abstract classes the implementer must define FIRST
      - Module structure: proposed directory layout and file names for new/modified code
      - Mermaid diagram: component or layer diagram if it clarifies the structure

      ## Step 2 — Validate plan against design
      Review Plan_ref against the architecture designed above:
      - Does the file list match the proposed module structure?
      - Are layer boundaries respected in the implementation steps?
      - Are required interfaces listed before their concrete implementations?

      Update {{handoff_file}}:
      - Architecture_design_ref: path to design artifact
      - Design_summary: 3–5 bullets (layers, patterns, key interfaces)
      If APPROVED: Architect_approval: yes, Next=implementer.
      If REJECTED: Blocked: true, Return_to_step: plan, Block_reason: [specific violations].
  - id: implement
    subagent_type: implementer
    skills:
      - common-best-practices
      - common-error-handling
    entry_criteria: Plan and architecture approved
    exit_criteria: Code changes complete, no lint errors
    handoff_to: test
    on_concern_return_to: architect
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}} and Plan_ref. Verify Architect_approval: yes before implementing.
      Follow implement_guidance from $AGENT_KIT/workflows/_domain-commands.yaml for {{domain}} and your loaded persona.
      Implement code per the plan, test-first: for each behaviour you change, write or update its test, watch it fail, then make it pass.
      Never delete, skip or weaken an existing assertion to get a green run — if a test is wrong, say so in the handoff instead.
      If you discover information affecting the plan, update Plan_ref with '## Implementation Notes'. Set Plan_updated: yes in {{handoff_file}}.
      Run analyze commands from _domain-commands.yaml to verify no lint errors.
      Update {{handoff_file}} (Changes made, Next=tester).
      If blocked, set Blocked: true, Return_to_step: architect, Block_reason: [reason].
  - id: test
    subagent_type: tester
    skills:
      - common-tdd
    entry_criteria: Implementation complete
    exit_criteria: Full suite and analyzers pass; plan scenarios covered
    handoff_to: review
    on_concern_return_to: implement
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}}. You are the gate, not the author: the implementer wrote the tests for what it changed.
      1. Run the full test + analyze commands from $AGENT_KIT/workflows/_domain-commands.yaml ({{domain}} section).
      2. Separate failures caused by this change from failures that were already there (check with git stash or the base branch if unsure).
      3. Read Spec_refs. For each [automated] scenario the plan references, confirm a test exists and covers it; add the missing ones, naming test functions after the TS-IDs and adding the header comment `// Validates: TS-{FEAT}-NNN — {title}`.
      4. Update the spec's Traceability Matrix with test file paths and status.
      5. Create report in .agent-output/tester/ with coverage "{N}/{M} plan scenarios have passing tests" and the commands you ran.
      MANDATORY: ALL test/analyze commands MUST exit 0. If any fails because of this change, set Blocked: true, Return_to_step: implement, Block_reason: [failures with details].
      Update {{handoff_file}} (Test_report, Next=post-test group: code-reviewer + security-auditor).
  - id: review
    subagent_type: code-reviewer
    skills:
      - common-code-review
      - common-security-standards
    entry_criteria: Tests pass (or Requires_tests is no)
    exit_criteria: Code review approved or changes requested
    handoff_to: verify
    on_concern_return_to: implement
    execution_hints:
      parallel_group: post-test
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}}, the diff (git diff), and Spec_refs. Apply the domain review checklist from your loaded persona.
      Check that the implementation respects Requirements_preserved from the handoff.
      Audit the test diff as well: assertions deleted or weakened, tests skipped or marked pending, tests that assert implementation detail instead of behaviour, acceptance criteria with no test, tests written so they cannot fail.
      Report only defects you can point at in the diff; an empty list is a valid result.
      This step runs concurrently with security: do NOT edit {{handoff_file}}.
      Generate report in .agent-output/code-reviewer/ ending with these fields:
        Code_review_verdict: APPROVED | REQUIRES_CHANGES
        Block_reason: [corrections] (only if REQUIRES_CHANGES)
  - id: security
    subagent_type: security-auditor
    skills:
      - common-security-audit
      - common-security-standards
    entry_criteria: Tests pass (or Requires_tests is no)
    exit_criteria: No critical/high findings
    handoff_to: verify
    on_concern_return_to: implement
    execution_hints:
      parallel_group: post-test
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}}. This step runs concurrently with review: do NOT edit {{handoff_file}}.
      If Security_critical_feature: no, return Security_audit: N/A without a scan.
      If yes, execute the methodology from $AGENT_KIT/workflows/security-devsecops.workflow.yaml adapted to {{domain}}. Use tools from _domain-commands.yaml security section plus domain-specific tools.
      Generate report in .agent-output/security-auditor/ ending with these fields:
        Security_audit: PASS | CONDITIONAL | FAIL | N/A
        Block_reason: [critical vulnerabilities] (only if FAIL)
  - id: verify
    subagent_type: verifier
    skills:
      - common-protocol-enforcement
    entry_criteria: All prior steps complete
    exit_criteria: Every acceptance criterion met with evidence, or reported as a gap
    handoff_to: document
    on_concern_return_to: implement
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}}. Validate the acceptance criteria from Plan_ref — nothing else; do not add requirements.
      Produce your own evidence: run the commands the plan names and the domain's test/analyze commands, read the diff.
      Report each criterion as met or not with its evidence (command + result, or file:line). Prefer reporting a gap over assuming.
      Confirm the recorded verdicts: Architect_approval, Code_review_verdict, Security_audit.
      Traceability check (if specs exist for this feature): every touched RULE-{FEAT}-NNN has a TS scenario, every [automated] TS the plan references has a test file in the matrix, and those tests pass. Report gaps; do not fix them here.
      For Manual_verification items: verify programmatically if possible, else ASK the user. Do NOT mark done until all are resolved.
      Update {{handoff_file}} (Verification: PASS | GAPS, gap list, Next=doc-writer).
      If criteria are unmet: Blocked: true, Return_to_step: implement, Block_reason: [gaps].
  - id: document
    subagent_type: doc-writer
    skills:
      - knowledge-audit
    entry_criteria: Verification passed
    exit_criteria: Specs, ADRs and knowledge reflect what shipped
    handoff_to: null
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Read {{handoff_file}}, Plan_ref and the verification result. Document only what actually shipped.
      1. Update affected specs in specs/features/ (requirements, scenarios, Coverage line).
      2. If an architecture decision was made, write an ADR in specs/architecture/ from $AGENT_KIT/templates/adr.template.md.
      3. Update specs/PROJECT.md (Decision Log or metrics) with a one-line summary.
      4. Write specs/knowledge/searchable/YYMMDD-{topic}-validation.md: changes, automated results, traceability coverage, specs updated.
      5. SDD closure: READ $AGENT_KIT/skills/knowledge-audit/SKILL.md and execute it in the repo root — relink stale paths, merge unique knowledge into canonical specs, refresh specs/knowledge/README.md, sync specs/PROJECT.md tables, git rm obsolete knowledge when Tier B safe. Skip the prune if the run was blocked and nothing was promoted.
      Update {{handoff_file}} (Docs_updated, Next=none).
      When the task is DONE: DELETE {{handoff_file}}.
