# handoff_file: Orchestrator MUST inject. With worktree: .agent-output/handoff-<branch>.md; without: .agent-output/handoff-odd.md.
#               When task DONE: DELETE handoff file. No pending handoffs, zombies, or orphans.
#
# Size-gated, by-reference delivery (decision rules adapted from gentle-ai's ODD; see docs/research/gentle-ai/).
# Four steps instead of a role per concern. Every step carries `execution_hints.inline: true`: the agent that holds the
# plan performs it itself and spawns a role only when a "Delegation triggers" row of kit-orchestration fires.
# Domain-agnostic: orchestrator injects {{domain}} from detection.
name: odd
description: Size-gated delivery for one change. Classify (inline, light, full), keep a temporal tasks ledger next to the spec, implement inline unless a delegation trigger fires, verify by risk, close by folding the ledger into the spec.
domain: "{{domain}}"
trigger: User asks for one concrete change and wants the least delegation that is still safe (a fix, a small feature, a rename, a config or doc change), or says "odd", "size it first" or "keep it light".
prerequisites: [ ]
steps:
  - id: classify
    subagent_type: planner
    skills:
      - common-context-optimization
      - common-system-design
    entry_criteria: User goal defined
    exit_criteria: Authorization decided; Sizing block written; ledger created when the mode is light or full
    handoff_to: implement
    execution_hints:
      inline: true
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}. Goal: {{user_goal}}.
      Read common-system-design only in mode full (it is listed so the planner preload stays whole).
      1. Authorize: a request to investigate, explain, compare or propose is read-only; stop after the answer and write nothing. Ask one question only when the request is ambiguous about authorizing a change.
      2. Map with at most 3 lookups (more than ~5 lookups or ~10k tokens of evidence: one read-only explore). Never explore files you will read anyway.
      3. Classify with the resume test and the six risk items of $AGENT_KIT/skills/kit-orchestration/SKILL.md "Task size". Honor --inline, --light, --full if the goal carries one. State the Sizing block in the reply.
      4. For light or full: create specs/features/<feature>/tasks.md from $AGENT_KIT/templates/tasks.template.md (English criteria, each with a short source: link; no quotes). Then the best-effort Engram mirror of $AGENT_KIT/skills/kit-orchestration/references/task-ledger.md.
      5. Update {{handoff_file}} (Spec_ref, Task_ids, Spec_ids, Class, Route, Next assigned role=implementer).
      If you have concern or blockage, set Blocked: true, Return_to_step: classify, Block_reason: [reason] in {{handoff_file}}.
  - id: implement
    subagent_type: implementer
    skills:
      - common-best-practices
    entry_criteria: Mode and authorization decided
    exit_criteria: Every T# done with its commit; RED, PRESERVE and differential checks run; Risk line on the change
    handoff_to: verify
    on_concern_return_to: classify
    execution_hints:
      inline: true
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Work by reference: the tasks.md named in Spec_ref of {{handoff_file}} (or the user's request verbatim when there is none), tasks T#, specs S#. Read it until "## Log".
      Do the work inline. Delegate only when a Delegation triggers row of kit-orchestration fires (two or more independent units over ~100 changed lines each with disjoint edit surfaces, or a near-full context); record route and reason in the ledger.
      Follow the implementer role rules: RED per requested rule, PRESERVE test per touched command, differential check, one commit per unit (a risk item gets its own), commit id on each T#.
      End with `Risks: item N (reason)` or `Risks: none`, and `Covered: T#, S#`.
      Update {{handoff_file}} (Next assigned role=verifier). Never push, open a PR or merge.
  - id: verify
    subagent_type: verifier
    skills:
      - common-best-practices
      - common-protocol-enforcement
    entry_criteria: Implementation committed
    exit_criteria: One verdict per S#
    handoff_to: close
    on_concern_return_to: implement
    execution_hints:
      inline: true
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      Skill common-protocol-enforcement is read only when an independent verifier runs.
      Verify by risk (kit-orchestration "Task size"): no risk item and mode inline or light = read the diff and run the proof command of each S# yourself; a named risk item or mode full = one independent verifier (a different model family than the writer, ADR-0007) runs the authorized spec examples in a scratch copy made with mktemp -d, outside the workspace.
      Report one verdict per S# with the command and the observed result. One correction batch, one recheck.
      Update {{handoff_file}} (verification=PASS or GAPS, Blocked and Return_to_step=implement when GAPS).
  - id: close
    subagent_type: doc-writer
    skills:
      - knowledge-audit
    entry_criteria: Verification PASS
    exit_criteria: Ledger folded into the spec or decisions and deleted; outcome reported
    handoff_to: null
    on_concern_return_to: verify
    execution_hints:
      inline: true
    prompt_template: |
      Workspace: {{workspace}}. Domain: {{domain}}.
      For light or full: READ $AGENT_KIT/skills/knowledge-audit/SKILL.md, fold what is durable from the ledger (criteria that became RULE-*/TS-*, decisions, rejected options) into the spec or specs/knowledge/decisions/, fill "Sizing (actual)", update the Engram mirror to closed (task-ledger.md), then delete the ledger. For inline: nothing to fold.
      Report to the user: outcome, changed paths, failed or pending checks, next step. Merge or PR only if the user prefers (skill finishing-a-development-branch).
      When task DONE: DELETE {{handoff_file}}. No pending handoffs, zombies, or orphans.
