name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate kit content
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # httpx too: the LiteLLM module imports it, and the gateway-rendering
        # tests exercise that module.
        run: pip install pyyaml pytest httpx

      - name: Validate skills, workflows, roles, scripts and references
        run: python3 scripts/validate_kit.py

      - name: Compile the CLI and hooks
        run: python3 -m compileall -q scripts hooks

      - name: Check the OpenClaw host scripts parse
        run: for f in scripts/openclaw/*.sh; do bash -n "$f"; done

      # validate_kit checks structure and compileall checks syntax; neither
      # exercises behaviour. These cover the gateway translation, profile
      # selection, non-interactive prompts and subagent generation — the paths
      # where silent breakage would otherwise reach a release unnoticed.
      - name: Run unit tests
        run: python3 -m pytest tests/ -q

      # The plugin and marketplace manifests are checked by validate_kit.py above: it verifies
      # every declared path exists and that the agents list matches agents/roles/. Running
      # `claude plugin validate` here as well would mean installing and authenticating the CLI
      # in CI; it is part of the release checklist instead.
