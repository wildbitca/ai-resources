name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate kit content (${{ matrix.ui }} UI libraries)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # What `brew install` ships (Formula/ai-resources.rb): this is what users run.
          - ui: formula
            pins: "rich==13.9.4 questionary==2.1.0 prompt_toolkit==3.0.48 wcwidth==0.2.13"
          # The newest releases the wizard was also checked against.
          - ui: latest
            pins: "rich==15.0.0 questionary==2.1.1 prompt_toolkit==3.0.53"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # httpx too: the LiteLLM module imports it, and the gateway-rendering
        # tests exercise that module. rich, questionary and prompt_toolkit are pinned (the matrix
        # runs the Formula versions and the newest ones) so the real-library UI tests run instead of
        # being skipped. pytest-xdist runs the suite in parallel (scripts/run-tests.sh).
        run: pip install pyyaml pytest pytest-xdist httpx ${{ matrix.pins }}

      - name: Validate skills, workflows, roles, scripts and references
        run: python3 scripts/validate_kit.py

      - name: Compile the CLI and hooks
        run: python3 -m compileall -q scripts hooks

      - name: Check the OpenClaw host scripts parse
        run: for f in scripts/openclaw/*.sh; do bash -n "$f"; done

      # validate_kit checks structure and compileall checks syntax; neither
      # exercises behaviour. These cover the gateway translation, profile
      # selection, non-interactive prompts and subagent generation — the paths
      # where silent breakage would otherwise reach a release unnoticed.
      # In parallel, then the `timing` tests (wall-clock budgets) in one process: the same script as local runs.
      - name: Run unit tests
        run: scripts/run-tests.sh

      # The OpenClaw plugin (claude-kit and agy-cli backends) has its own node:test suite, which no job ran before.
      # It has no dependencies, so the Node that ships on the runner is enough (engines: node >= 18).
      - name: Run the OpenClaw plugin tests
        run: |
          node --version
          cd openclaw-plugin/ai-resources && npm test

      # The plugin and marketplace manifests are checked by validate_kit.py above: it verifies
      # every declared path exists and that the agents list matches agents/roles/. Running
      # `claude plugin validate` here as well would mean installing and authenticating the CLI
      # in CI; it is part of the release checklist instead.

  # Dry run on pull requests: the same consistency check the release job runs, without publishing.
  release-check:
    name: Release dry run (version files and CHANGELOG notes)
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency and release notes
        run: |
          python3 scripts/ci/release_check.py --notes-file "${RUNNER_TEMP}/notes.md"
          echo "--- release notes preview ---"
          cat "${RUNNER_TEMP}/notes.md"

  # Publishes the release when CI is green on main. Skips quietly when the version already has a tag.
  # Manual fallback: .github/workflows/release.yml (workflow_dispatch).
  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate # all matrix legs must pass
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }} # the merge commit this push produced
          token: ${{ github.token }} # authenticates `git ls-remote` below

      - name: Check version consistency and extract release notes
        id: check
        run: python3 scripts/ci/release_check.py --notes-file "${RUNNER_TEMP}/notes.md" >> "$GITHUB_OUTPUT"

      - name: Look for an existing tag
        id: tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          # ls-remote --exit-code: 0 = tag found, 2 = no match, anything else (128: network, auth, 5xx) is a failure.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists; nothing to publish."
          elif [ "$rc" -eq 2 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "git ls-remote failed with exit code ${rc}; not assuming the tag is missing." >&2
            exit "$rc"
          fi

      - name: Create tag and GitHub Release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.check.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          draft: false
          prerelease: false
