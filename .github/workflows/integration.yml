name: Integration tests

# The tests marked `integration` drive real processes, locks and external tools (openclaw, node, git...).
# They are skipped by the CI workflow; this one runs them on demand and weekly, and never blocks a merge.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest pytest-xdist httpx rich==13.9.4 questionary==2.1.0 prompt_toolkit==3.0.48 wcwidth==0.2.13

      - name: Run the unit and integration tests
        run: INTEGRATION=1 scripts/run-tests.sh
