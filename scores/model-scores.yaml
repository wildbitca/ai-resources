# Kit-shipped model scores database (read-only). Schema and rules: scores/README.md and
# docs/decisions/0006-scored-team-composition.md.
#
# Every score cites a file:line under .agent-output/research-models/ and carries a dated evidence label.
# The operator's earlier example numbers are NOT seed data. Importance, tolerance and load are POLICY.
# There is no `verified` key: verification comes only from setup/compat.py (the compat matrix).
# User overrides live in ~/.config/ai-resources/model-scores.yaml, never in this file.
schema_version: 1
dataset_version: '2026-10-13'
policy:
  label: POLICY
  notes: Importance, tolerance classes, load weights, diversity and loss cap are operator policy, never evidence. The loss cap cannot bind in mixed mode because every role is picked inside its tolerance band, so the weighted loss is at most the sum of importance x tolerance (4.91 today) and that is below the cap of 5.0. It guards uniform and single-provider where the shape contract can force a role out of its band. Each role's loss is clamped at 0.
  importance:
    planner: 1.0
    implementer: 1.0
    software-architect: 0.9
    code-reviewer: 0.9
    verifier: 0.9
    security-auditor: 0.8
    generalPurpose: 0.7
    crashlytics-fixer: 0.6
    sentry-fixer: 0.6
    terraform-maintainer: 0.6
    crossplane-upjet-maintainer: 0.6
    package-upgrade: 0.5
    tester: 0.5
    doc-writer: 0.3
    explore: 0.3
  tolerance_classes:
    critical: 0.3
    standard: 0.5
    low: 1.0
  role_class:
    planner: critical
    implementer: critical
    software-architect: critical
    security-auditor: critical
    code-reviewer: standard
    verifier: standard
    generalPurpose: standard
    crashlytics-fixer: standard
    sentry-fixer: standard
    terraform-maintainer: standard
    crossplane-upjet-maintainer: standard
    tester: standard
    package-upgrade: low
    doc-writer: low
    explore: low
  load_weight:
    implementer: 3.0
    planner: 1.5
    tester: 1.5
    code-reviewer: 1.5
    generalPurpose: 1.5
    software-architect: 1.0
    verifier: 1.0
    security-auditor: 1.0
    crashlytics-fixer: 1.0
    sentry-fixer: 1.0
    terraform-maintainer: 1.0
    crossplane-upjet-maintainer: 1.0
    explore: 1.0
    package-upgrade: 0.5
    doc-writer: 0.5
  diversity_tolerance: 0.5
  diversity_roles:
  - code-reviewer
  - verifier
  loss_cap: 5.0
  reference_tokens:
    prompt: 60000
    output: 6000
    cached_fraction: 0.5
  static_headroom:
    ample: 1.0
    normal: 0.7
    scarce: 0.3
  decisions: 'Operator decisions of 2026-10-13: reviewer and verifier are the standard class (0.5); vendor diversity is a soft preference within 0.5.'
routes:
  anthropic-direct:
    provider: anthropic
    surface: claude-code
    notes: Anthropic models through the Claude Code cockpit (subscription login or API key).
  vertex-global:
    provider: vertex
    surface: claude-code
    notes: 5.x models are served on the global or multi-region endpoints only (usage-anthropic.md:187-189).
  google-ai-studio:
    provider: google
    surface: claude-code
  openrouter:
    provider: openrouter
    surface: claude-code
    mode_key: multi-model:openrouter
  litellm:
    provider: vendor
    surface: claude-code
    mode_key: multi-model:litellm
  openclaw-codex-engine:
    provider: openai
    surface: codex
    notes: OpenClaw codex engine; the kit has no codex exec dispatch path (usage-openai-and-cross-benchmarks.md:164).
surfaces:
  claude-code:
    usage: dispatch-ok
    reason: The kit dispatches roles through Claude Code subagents.
    source_ref: docs/decisions/0005-cross-provider-role-dispatch.md
  agy:
    usage: direct-only
    reason: 'Antigravity FAQ: third-party tools (Claude Code, OpenClaw, OpenCode) that access Antigravity violate its ToS; agy -p is for direct scripting and CI.'
    source_ref: .agent-output/research-models/usage-google.md:9,56-58
  engine:antigravity:
    usage: direct-only
    reason: 'Antigravity FAQ: running agy inside third-party agents is not supported and violates its ToS; accounts get suspended.'
    source_ref: .agent-output/research-models/usage-google.md:9,56-58
  codex:
    usage: instructions-only
    reason: The Codex cockpit is instructions only in all 21 compat cells and the kit has no codex exec dispatch path.
    source_ref: .agent-output/research-models/usage-openai-and-cross-benchmarks.md:155,164
pools:
- id: claude-subscription
  billing_class: subscription
  provider: anthropic
  cockpit_or_engine: claude-code
  routes:
  - anthropic-direct
  vendors:
  - anthropic
  windows:
  - 5h
  - weekly
  headroom_source: statusline-sidecar
  plan_wide: true
  model_weights:
    kind: qualitative
    tiers:
      claude-haiku-5.5: Low
      claude-sonnet-5.5: Moderate
      claude-opus-5.5: High
      claude-fable-5.1: Very High
    notes: No numeric allowance or weight is published (usage-anthropic.md:74-78).
  headless_draws_plan: true
  credits_cache_ttl_minutes: 5
  hard_stop_errors: []
  usage: dispatch-ok
  facts:
  - 'Session and weekly limits are shared across models, chat and Cowork (usage-anthropic.md:30-32,61-62), so plan_wide is true for those windows but not for Fable: Max also has a separate weekly limit for Fable (support.claude.com article 11145838, re-checked 2026-10-13).'
  - claude -p and the Agent SDK draw the same plan limits (usage-anthropic.md:97-101).
  - Usage credits change the prompt-cache TTL from 1 hour to 5 minutes (usage-anthropic.md:41-43).
  - Fable 5.1 runs on usage credits on Pro and Team Standard, and claude -p bills it without asking (usage-anthropic.md:67-73).
  label: VENDOR
  as_of: '2026-10-13'
  source_ref: .agent-output/research-models/usage-anthropic.md:24-87
- id: anthropic-api
  billing_class: metered-api
  provider: anthropic
  cockpit_or_engine: claude-code
  routes:
  - anthropic-direct
  vendors:
  - anthropic
  windows:
  - per-minute-buckets
  - monthly-spend
  headroom_source: none
  model_weights:
    kind: per-model-buckets
    notes: Opus 5.5, Sonnet 5.5 and Haiku 5.5 have separate buckets (usage-anthropic.md:150-155).
  headless_draws_plan: false
  credits_cache_ttl_minutes: null
  hard_stop_errors:
  - code: enforced_spend_limit_reached
    http: 429
    retry_after: false
    resumes: 00:00 UTC next month
    note: CLAUDE_CODE_RETRY_WATCHDOG=1 fails fast on it.
  usage: dispatch-ok
  label: VENDOR
  as_of: '2026-10-13'
  source_ref: .agent-output/research-models/usage-anthropic.md:145-167
- id: vertex-claude
  billing_class: metered-api
  provider: vertex
  cockpit_or_engine: claude-code
  routes:
  - vertex-global
  vendors:
  - anthropic
  - google
  windows:
  - per-minute-quota
  headroom_source: vertex-quotas
  model_weights:
    kind: per-model-lineage-quota
    notes: 'Global QPM: Haiku 5.5 3,000, Sonnet 5.5 2,500, Opus 5.5 2,000 (usage-anthropic.md:198-200). The quota page usage may be inaccurate (usage-google.md:135).'
  headless_draws_plan: false
  credits_cache_ttl_minutes: null
  hard_stop_errors: []
  usage: dispatch-ok
  facts:
  - Route vertex-global only for 5.x; pin ANTHROPIC_DEFAULT_*_MODEL because the sonnet and haiku aliases resolve to 4.5 on Vertex (usage-anthropic.md:209-211).
  label: VENDOR
  as_of: '2026-10-13'
  source_ref: .agent-output/research-models/usage-anthropic.md:182-214
